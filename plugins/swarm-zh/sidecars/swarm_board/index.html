<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No frame may navigate anywhere: blocks the narrator frame from
       navigating itself (its srcdoc load is exempt). See app.js. -->
  <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'">
  <title>Swarm 协作看板</title>
  <script src="/preload.js"></script>
  <!-- Google Sans Flex (the Hub's UI face, same axes as the Hub) and Google Sans Code. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,opsz,slnt,wdth,wght@0..100,6..144,-10..0,92..100,100..1000&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/hive.css">
</head>
<body>
  <!-- Loading: a skeleton of the board, so the pane never flashes empty. -->
  <div id="loading" class="loading" data-testid="swarm-loading" aria-live="polite" aria-busy="true">
    <div class="skel-header">
      <span class="skel skel-line" style="width: 46%; height: 12px"></span>
      <span class="skel skel-line" style="width: 28%"></span>
    </div>
    <div class="skel-tabs">
      <span class="skel skel-tab"></span><span class="skel skel-tab"></span><span class="skel skel-tab"></span><span class="skel skel-tab"></span>
    </div>
    <div class="skel-rows" aria-hidden="true">
      <div class="skel-stack"><span class="skel skel-line" style="width: 22%"></span><span class="skel skel-line" style="width: 88%"></span><span class="skel skel-line" style="width: 62%"></span></div>
      <div class="skel-stack"><span class="skel skel-line" style="width: 18%"></span><span class="skel skel-line" style="width: 74%"></span></div>
      <div class="skel-stack"><span class="skel skel-line" style="width: 26%"></span><span class="skel skel-line" style="width: 92%"></span><span class="skel skel-line" style="width: 48%"></span></div>
    </div>
    <p class="loading-caption">正在查找此会话的 Swarm…</p>
  </div>

  <div id="board" class="board hidden" data-testid="swarm-board">
    <header class="header">
      <div class="header-row">
        <h1 id="swarm-title" class="swarm-title" data-testid="swarm-title"></h1>
        <span id="live" class="live" role="status" title="自动更新" data-testid="swarm-live">
          <span class="live-dot" aria-hidden="true"></span><span id="live-label" class="live-label">实时</span>
        </span>
      </div>
      <div id="swarm-meta" class="meta hidden" data-testid="swarm-meta"></div>
      <nav class="tabs" role="tablist" aria-label="Swarm 视图" data-testid="swarm-tabs">
        <button type="button" role="tab" id="tabbtn-overview" aria-controls="tab-overview" aria-selected="false" tabindex="-1" data-tab="overview" class="tab hidden" data-testid="swarm-tab-overview">概览<span id="tab-badge-overview" class="tab-badge hidden" data-testid="swarm-tab-badge-overview"></span></button>
        <button type="button" role="tab" id="tabbtn-feed" aria-controls="tab-feed" aria-selected="true" data-tab="feed" class="tab active" data-testid="swarm-tab-feed">看板<span id="tab-count-feed" class="tab-count" data-testid="swarm-tab-count-feed"></span></button>
        <button type="button" role="tab" id="tabbtn-members" aria-controls="tab-members" aria-selected="false" tabindex="-1" data-tab="members" class="tab" data-testid="swarm-tab-members">成员<span id="tab-count-members" class="tab-count" data-testid="swarm-tab-count-members"></span></button>
        <button type="button" role="tab" id="tabbtn-graph" aria-controls="tab-graph" aria-selected="false" tabindex="-1" data-tab="graph" class="tab hidden" data-testid="swarm-tab-graph">关系图</button>
        <button type="button" role="tab" id="tabbtn-raw" aria-controls="tab-raw" aria-selected="false" tabindex="-1" data-tab="raw" class="tab hidden" data-testid="swarm-tab-raw">原始数据</button>
      </nav>
    </header>

    <main class="main">
      <!-- Overview: chrome (trusted, rendered by app.js) around the narrator's
           view, which runs in a sandboxed frame or as the plain view. Hidden
           (tab and all) until the swarm has a view.json or view.html. -->
      <section id="tab-overview" class="tab-body" role="tabpanel" aria-labelledby="tabbtn-overview" data-testid="swarm-overview">
        <div id="ov-status" class="ov-status" data-testid="swarm-overview-status"></div>
        <div id="ov-system" class="ov-system hidden" role="list" aria-label="系统提醒" data-testid="swarm-overview-system"></div>
        <div id="ov-notice" class="ov-notice hidden" role="status" data-testid="swarm-overview-notice"></div>
        <div id="ov-label" class="ov-label hidden" data-testid="swarm-overview-label">
          <span class="ov-label-text">概览 · 来自讲述者的记录</span>
          <span class="spacer"></span>
          <button id="ov-mode" type="button" class="ghost-btn sm" aria-pressed="false" data-testid="swarm-overview-mode">讲述者页面</button>
        </div>
        <div id="ov-frame" class="ov-frame hidden" data-testid="swarm-overview-frame"></div>
        <div id="ov-plain" class="ov-plain hidden" data-testid="swarm-overview-plain"></div>
        <footer id="ov-footer" class="ov-footer hidden" data-testid="swarm-overview-footer">
          <div class="ov-hint">
            <span aria-hidden="true">💡</span>
            <span>想调整此视图？请告诉协调者。</span>
            <button id="ov-open-coord" type="button" class="link-btn" data-testid="swarm-overview-open-coordinator">打开协调者会话</button>
          </div>
          <div id="ov-ack" class="ov-ack hidden" data-testid="swarm-overview-ack"></div>
        </footer>
      </section>

      <!-- Board -->
      <section id="tab-feed" class="tab-body active" role="tabpanel" aria-labelledby="tabbtn-feed">
        <div class="toolbar">
          <div class="searchbar">
            <label class="search">
              <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/></svg>
              <input id="f-search" type="search" placeholder="搜索" aria-label="搜索看板消息" autocomplete="off" data-testid="swarm-search">
            </label>
            <button id="f-toggle" type="button" class="icon-btn filter-toggle" aria-expanded="false" aria-controls="filters" title="筛选" aria-label="筛选" data-testid="swarm-filter-toggle">
              <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3"/></svg>
              <span class="filter-dot" aria-hidden="true"></span>
            </button>
          </div>
          <!-- Channels: shown only once the swarm has a non-main channel. -->
          <div id="channel-tabs" class="channel-tabs hidden" role="tablist" aria-label="频道" data-testid="swarm-channel-tabs"></div>
          <div id="filters" class="filters hidden" data-testid="swarm-filters">
            <div class="toolbar-row">
              <span class="select"><select id="f-agent" aria-label="按发送者筛选" title="显示某位成员发送的消息"><option value="">所有发送者</option></select></span>
              <span class="select"><select id="f-mention" aria-label="按接收者筛选" title="显示提及某位成员的消息"><option value="">所有接收者</option></select></span>
              <span id="f-channel-wrap" class="select hidden"><select id="f-channel" aria-label="按频道筛选" title="显示某个频道中的消息" data-testid="swarm-channel-filter"><option value="">所有频道</option></select></span>
              <span class="spacer"></span>
              <label class="switch" title="始终显示最新消息">
                <input type="checkbox" id="f-autoscroll" checked><span class="switch-track" aria-hidden="true"></span><span>跟随最新消息</span>
              </label>
            </div>
            <div id="agents" class="agents" data-testid="swarm-agents" role="group" aria-label="显示或隐藏各成员的消息"></div>
          </div>
        </div>
        <div id="feed" class="feed" data-testid="swarm-feed" aria-live="polite" aria-relevant="additions"></div>
        <button id="jump-latest" type="button" class="jump hidden" data-testid="swarm-jump-latest">
          <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v9.5M4 9l4 4 4-4"/></svg>最新消息
        </button>
      </section>

      <!-- Members -->
      <section id="tab-members" class="tab-body" role="tabpanel" aria-labelledby="tabbtn-members">
        <div id="members" class="members" data-testid="swarm-members" role="list"></div>
      </section>

      <!-- Graph -->
      <section id="tab-graph" class="tab-body" role="tabpanel" aria-labelledby="tabbtn-graph">
        <div class="player">
          <div class="player-row">
            <div class="btn-group" role="group" aria-label="回放">
              <button id="replay-start" type="button" class="icon-btn" title="跳转到开头" aria-label="跳转到开头">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3.5v9"/><path class="fill" d="M12.5 3.8v8.4a.4.4 0 0 1-.62.33L6.3 8.33a.4.4 0 0 1 0-.66l5.58-4.2a.4.4 0 0 1 .62.33z"/></svg>
              </button>
              <button id="replay-back" type="button" class="icon-btn" title="上一条消息（←）" aria-label="上一条消息">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
              </button>
              <button id="replay-play" type="button" class="icon-btn play" title="播放 / 暂停回放（空格键）" aria-label="播放回放" data-testid="swarm-replay-play"></button>
              <button id="replay-fwd" type="button" class="icon-btn" title="下一条消息（→）" aria-label="下一条消息">
                <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
              </button>
            </div>
            <input id="replay-slider" class="slider" type="range" min="0" max="0" value="0" aria-label="回放位置" title="拖动以浏览看板消息">
            <button id="replay-live" type="button" class="pill-btn on" title="显示全部内容并跟随实时更新" aria-pressed="true"><span class="live-dot" aria-hidden="true"></span>实时</button>
          </div>
          <div class="player-row sub">
            <span id="replay-label" class="replay-label"></span>
            <span class="spacer"></span>
            <label class="switch" title="在关系图中隐藏已终止及不活跃的成员">
              <input type="checkbox" id="g-hide-inactive" data-testid="swarm-graph-hide-inactive"><span class="switch-track" aria-hidden="true"></span><span>隐藏不活跃成员</span>
            </label>
            <label class="switch" title="将 @all 显示为连接各成员的连线">
              <input type="checkbox" id="g-all"><span class="switch-track" aria-hidden="true"></span><span>展开 @all</span>
            </label>
            <span class="select sm"><select id="replay-timing" aria-label="回放节奏" title="回放节奏">
              <option value="even">均匀间隔</option>
              <option value="real">实际时间间隔</option>
            </select></span>
            <span class="select sm"><select id="replay-speed" aria-label="回放速度" title="回放速度">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
              <option value="8">8×</option>
            </select></span>
          </div>
        </div>
        <svg id="graph" class="graph" data-testid="swarm-graph" preserveAspectRatio="xMidYMin meet" role="img" aria-label="成员之间的 @提及关系"></svg>
        <div class="graph-legend" aria-hidden="true">
          <span class="legend-item"><svg width="22" height="8" viewBox="0 0 24 8"><path d="M1 4h18" class="lg-solid"/><path d="M17 1l5 3-5 3z" class="lg-head"/></svg>@提及，线宽表示次数</span>
          <span class="legend-item"><svg width="22" height="8" viewBox="0 0 24 8"><path d="M1 4h18" class="lg-dash"/><path d="M17 1l5 3-5 3z" class="lg-head"/></svg>通过 @all</span>
          <span class="legend-item"><svg width="16" height="10" viewBox="0 0 16 10"><rect x="1" y="1" width="14" height="8" rx="4" class="lg-ring"/></svg>未提及任何人的消息</span>
          <span class="legend-item"><span class="lg-bcast">@all 2</span>@all 消息，可通过“展开 @all”显示连线</span>
        </div>
        <div id="replay-caption" class="msg replay-caption hidden" aria-live="polite"></div>
      </section>

      <!-- Raw -->
      <section id="tab-raw" class="tab-body" role="tabpanel" aria-labelledby="tabbtn-raw">
        <div class="raw-toolbar">
          <div class="segmented" role="group" aria-label="文件">
            <button type="button" data-raw="members" class="raw-btn on" aria-pressed="true">members.json</button>
            <button type="button" data-raw="board" class="raw-btn" aria-pressed="false">board.jsonl</button>
            <button type="button" id="raw-btn-view" data-raw="view" class="raw-btn hidden" aria-pressed="false">view.json</button>
          </div>
          <span class="spacer"></span>
          <button id="raw-copy" type="button" class="ghost-btn" title="复制到剪贴板" data-testid="swarm-raw-copy">
            <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-1.5a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg><span id="raw-copy-label">复制</span>
          </button>
        </div>
        <div id="raw-meta" class="raw-meta"></div>
        <pre id="raw" class="raw" data-testid="swarm-raw" tabindex="0"></pre>
      </section>
    </main>
  </div>

  <section id="empty" class="empty hidden" data-testid="swarm-empty-state" aria-labelledby="empty-title">
    <div class="empty-card">
      <svg class="empty-icon" width="56" height="56" viewBox="0 0 96 96" aria-hidden="true">
        <g class="links">
          <line x1="48" y1="26" x2="25" y2="66"/>
          <line x1="48" y1="26" x2="71" y2="66"/>
          <line x1="25" y1="66" x2="71" y2="66"/>
        </g>
        <circle class="node" cx="48" cy="26" r="9"/>
        <circle class="node" cx="25" cy="66" r="8"/>
        <circle class="node" cx="71" cy="66" r="8"/>
      </svg>
      <h2 id="empty-title" class="empty-title" data-testid="swarm-empty-title">此会话尚无 Swarm</h2>
      <p id="empty-body" class="empty-body" data-testid="swarm-empty-body"></p>
      <p class="empty-hint"><span class="live-dot" aria-hidden="true"></span>等待 Swarm 启动</p>
    </div>
  </section>

  <div id="toast" class="toast hidden" role="status" aria-live="polite" data-testid="swarm-toast"></div>

  <script src="/hive.js"></script>
  <script src="/app.js"></script>
</body>
</html>
